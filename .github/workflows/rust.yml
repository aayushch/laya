# Rust CI: fmt check and tests for the Tauri shell.

name: Rust CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
    paths:
      - "ui/src-tauri/**"
      - "ui/Cargo.toml"
      - "ui/Cargo.lock"
  pull_request:
    paths:
      - "ui/src-tauri/**"
      - "ui/Cargo.toml"
      - "ui/Cargo.lock"

jobs:
  rust-test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            pkg-config

      - name: Check formatting
        run: cargo fmt --all --manifest-path ui/src-tauri/Cargo.toml -- --check

      - name: Run tests
        run: cargo test --manifest-path ui/src-tauri/Cargo.toml
