[package]
name = "laya-app"
version = "1.0.4"
description = "Laya: Your AI Command Center"
authors = ["Aayush"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.90"

[lib]
name = "laya_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# The Tauri crates are pinned to exact versions. Those with an npm counterpart in
# ui/package.json must share its major.minor: `tauri dev`/`tauri build` compares the two
# sides and reports "Found version mismatched Tauri packages" otherwise. The crates they
# pull in (tauri-runtime, wry, tao, muda, ...) are fixed by the committed Cargo.lock; a
# build that resolves them afresh can pair `tauri` with a runtime crate it does not compile
# against. Bump the crate, its npm package and Cargo.lock together.
tauri = { version = "=2.12.0", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "=2.10.0"
tauri-plugin-shell = "=2.4.0"
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-updater = "=2.13.0"
tauri-plugin-process = "=2.4.0"
# `default-features = false` is deliberate: reqwest's defaults include `default-tls`
# (native-tls -> openssl-sys), which makes the final link require system OpenSSL
# (`-lssl -lcrypto`, i.e. libssl-dev on Debian/Ubuntu). That package is not in the
# README/CI apt dependency list, so builds fail with "unable to find library -lssl"
# on machines without it. We use rustls instead; `rustls-tls-native-roots` keeps
# trusting the OS certificate store (parity with the native-tls backend reqwest was
# previously picking at runtime), so corporate proxies / custom CAs still work for
# the runtime downloads in runtime.rs. `charset`/`http2`/`system-proxy` are the
# remaining reqwest defaults, re-listed so behaviour is otherwise unchanged.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "blocking",
    "rustls-tls-native-roots",
    "charset",
    "http2",
    "system-proxy",
] }
tokio = { version = "1", features = ["time", "process"] }
tauri-plugin-decorum = "=1.1.1"
tauri-plugin-os = "=2.4.0"
which = "6"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# OS random source for the per-launch engine API token. Already in the dependency
# tree (Cargo.lock) through other crates; listed here to call it directly.
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Turns SIGTERM/SIGINT into a normal app exit so the RunEvent::Exit cleanup stops
# the engine and n8n. Already in the dependency tree (Cargo.lock).
signal-hook = "0.3"

# Keeps one Laya running on macOS and Windows. Linux gets the same guarantee from
# the GTK application ID (`enableGTKAppId`), which forwards a second launch to the
# running instance before any plugin runs (see `run()` in lib.rs).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-single-instance = "=2.5.4"

# Low-level WebKitGTK bindings, for reading the loaded library's version at startup.
# Already in the dependency tree (Cargo.lock) through wry; pinned to that version.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk-sys = "=2.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
